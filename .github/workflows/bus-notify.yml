name: Bus notification
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
        default: "1"
permissions:
  issues: write
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "KRB bus is ready. Reply to this notification email to submit an encrypted command."
